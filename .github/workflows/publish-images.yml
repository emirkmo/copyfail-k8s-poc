name: Publish container images

on:
#  push:
#    branches: ["main"]
  workflow_dispatch:

env:
  UBUNTU_VERSION: "24.04"

jobs:


  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push observer image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: observer
          push: true
          build-args: |
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          tags: |
            ghcr.io/emirkmo/copyfk8s-poc:observer-ubuntu24.04
            ghcr.io/emirkmo/copyfk8s-poc:observer-latest

      - name: Build and push mutator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mutator
          push: true
          build-args: |
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            OBSERVER_IMAGE=ghcr.io/emirkmo/copyfk8s-poc:observer-ubuntu24.04
          tags: |
            ghcr.io/emirkmo/copyfk8s-poc:mutator-ubuntu24.04
            ghcr.io/emirkmo/copyfk8s-poc:mutator-latest
